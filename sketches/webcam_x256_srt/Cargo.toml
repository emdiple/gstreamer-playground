[package]
name = "gst-sub_pipe"
version = "0.1.0"
edition = "2024"

[dependencies]
glib = "0.20.9"
gst = {package = "gstreamer", version = "0.23.5"}
gstreamer-video = "0.23.5"
gst-plugin = "0.3.2"
anyhow = "1.0.98"
derive_more = { version = "2.0.1", features = ["display", "error"] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2.7"

[target.'cfg(target_os = "macos")'.build-dependencies]
system-deps = "7"
